pluginGroup = com.flightcoders.veyra.hotspots
pluginName = Hotspots Veyra
pluginVersion = 1.0.0

# Oldest supported IDE build: 2024.3. No upper bound, so new IDE versions keep working.
pluginSinceBuild = 243
platformVersion = 2024.3.6

# The IntelliJ Platform ships its own Kotlin standard library.
kotlin.stdlib.default.dependency = false

org.gradle.jvmargs = -Xmx768m -XX:MaxMetaspaceSize=320m -XX:ReservedCodeCacheSize=96m -Dfile.encoding=UTF-8
org.gradle.configuration-cache = true
org.gradle.caching = true
# Compile Kotlin inside the Gradle process: one JVM instead of two keeps memory low.
kotlin.compiler.execution.strategy = in-process
org.gradle.workers.max = 2
